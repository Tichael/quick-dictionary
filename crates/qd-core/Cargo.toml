[package]
name = "qd-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
flate2 = "1.1.10"
fst = { version = "0.4.7", features = ["levenshtein"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
unicode-normalization = "0.1.26"
