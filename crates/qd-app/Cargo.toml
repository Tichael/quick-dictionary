[package]
name = "quick-dictionary"
version = "0.4.0"
edition.workspace = true
license.workspace = true

[dependencies]
flate2 = "1.1.10"
hex = "0.4.3"
qd-core = { version = "0.1.0", path = "../qd-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sys-locale = "0.3.2"
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-opener = "2.7.2"
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-updater = "2.14.0"
ureq = "3.5.0"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }
