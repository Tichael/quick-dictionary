<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quick Dictionary</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="lookup.css">
</head>
<body>
  <header data-tauri-drag-region>
    <input id="query" type="search" placeholder="Type a word…" autocomplete="off" spellcheck="false" autofocus>
    <button class="icon" id="settings" title="Settings">⚙</button>
    <button class="icon" id="close" title="Hide (Esc)">✕</button>
  </header>
  <div id="completions"></div>
  <div id="notice"></div>
  <main id="results"></main>
  <div id="toast" hidden></div>
  <script type="module" src="errors.js"></script>
  <script type="module" src="lookup.js"></script>
</body>
</html>
