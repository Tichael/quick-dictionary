<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quick Dictionary — Settings</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <!-- Texts are replaced by the interface language's (see i18n.js). -->
  <nav>
    <a href="#dictionaries" class="current" data-i18n="nav.dictionaries">Dictionaries</a>
    <a href="#general" data-i18n="nav.general">General</a>
    <a href="#behavior" data-i18n="nav.behavior">Behavior</a>
    <a href="#about" data-i18n="nav.about">About</a>
  </nav>
  <main>
    <div id="message" hidden></div>

    <section id="dictionaries">
      <h2 data-i18n="dictionaries.title">Dictionaries</h2>
      <p class="hint" data-i18n-html="dictionaries.hint"></p>
      <h3 data-i18n="dictionaries.availableTitle">Available to download</h3>
      <div id="downloads"></div>
      <button id="check-downloads" class="link" data-i18n="dictionaries.checkAgain">Check again</button>

      <h3 data-i18n="dictionaries.installedTitle">Installed</h3>
      <div id="packs"></div>
      <div class="actions">
        <button id="add-pack" class="primary" data-i18n="dictionaries.add">Add a dictionary file…</button>
        <button id="open-folder" data-i18n="dictionaries.openFolder">Open the dictionaries folder</button>
        <button id="reload" data-i18n="dictionaries.reload">Reload</button>
      </div>
      <p class="hint" id="packs-dir"></p>
    </section>

    <section id="general">
      <h2 data-i18n="general.title">General</h2>
      <div class="row">
        <div>
          <div class="label" data-i18n="general.shortcut">Shortcut</div>
          <div class="hint" data-i18n="general.shortcutHint"></div>
        </div>
        <button id="shortcut" class="shortcut" data-i18n-title="general.shortcutButton"></button>
      </div>
      <label class="row">
        <div>
          <div class="label" data-i18n="general.startWithSystem">Start with the system</div>
          <div class="hint" data-i18n="general.startWithSystemHint"></div>
        </div>
        <input type="checkbox" data-setting="startWithSystem">
      </label>
      <label class="row">
        <div>
          <div class="label" data-i18n="general.language">Interface language</div>
          <div class="hint" data-i18n="general.languageHint"></div>
        </div>
        <select data-setting="language">
          <option value="system" data-i18n="general.languageSystem">Same as the system</option>
          <option value="en">English</option>
          <option value="fr">Français</option>
        </select>
      </label>
    </section>

    <section id="behavior">
      <h2 data-i18n="behavior.title">Behavior</h2>
      <label class="row">
        <div>
          <div class="label" data-i18n="behavior.hideOnBlur">Hide when the window loses focus</div>
          <div class="hint" data-i18n="behavior.hideOnBlurHint"></div>
        </div>
        <input type="checkbox" data-setting="hideOnBlur">
      </label>
      <label class="row">
        <div>
          <div class="label" data-i18n="behavior.clearOnShow">Start with an empty search</div>
          <div class="hint" data-i18n="behavior.clearOnShowHint"></div>
        </div>
        <input type="checkbox" data-setting="clearOnShow">
      </label>
      <label class="row">
        <div class="label" data-i18n="behavior.position">Window position</div>
        <select data-setting="position">
          <option value="cursor" data-i18n="behavior.positionCursor">At the mouse pointer</option>
          <option value="center" data-i18n="behavior.positionCenter">Center of the screen</option>
          <option value="remember" data-i18n="behavior.positionRemember">Where I last moved it</option>
        </select>
      </label>
      <label class="row">
        <div class="label" data-i18n="behavior.theme">Theme</div>
        <select data-setting="theme">
          <option value="system" data-i18n="behavior.themeSystem">Same as the system</option>
          <option value="light" data-i18n="behavior.themeLight">Light</option>
          <option value="dark" data-i18n="behavior.themeDark">Dark</option>
        </select>
      </label>
      <label class="row">
        <div class="label" data-i18n="behavior.maxResults">Results per search</div>
        <input type="number" min="1" max="50" data-setting="maxResults">
      </label>
    </section>

    <section id="about">
      <h2 data-i18n="about.title">About</h2>
      <p id="version"></p>
      <div class="row">
        <div>
          <div class="label" data-i18n="about.updates">Updates</div>
          <div class="hint" id="update-status"></div>
        </div>
        <div id="update-action"></div>
      </div>
      <p class="hint" data-i18n-html="about.licenses"></p>
    </section>
  </main>
  <script type="module" src="errors.js"></script>
  <script type="module" src="settings.js"></script>
</body>
</html>
