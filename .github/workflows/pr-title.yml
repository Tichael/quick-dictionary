name: PR title

# Squash-merged pull requests become one commit named after the PR title,
# and semantic-release reads that commit to decide the next version: the
# title must follow Conventional Commits ("feat: …", "fix(app): …").
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  check:
    name: Conventional Commits title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Reads the title only; no code from the pull request is checked out.
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ github.token }}
