name: CI

# Branches with a pull request are covered by its runs: pushes only run CI
# on main.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  pipeline:
    name: Pipeline tests (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        working-directory: pipeline
        run: python -m unittest -v

  ui:
    name: Interface strings (Node)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test
        run: node --test crates/qd-app/ui-tests/*.test.mjs

  # The desktop app (quick-dictionary) needs WebKitGTK on Linux, from a
  # package mirror that can be very slow; it is linted and tested in the
  # Windows build instead, on its real platform.
  rust:
    name: Rust checks and tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --workspace --exclude quick-dictionary --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --exclude quick-dictionary
