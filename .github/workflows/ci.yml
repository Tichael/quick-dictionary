name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  pipeline:
    name: Pipeline tests (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        working-directory: pipeline
        run: python -m unittest -v

  rust:
    name: Rust checks and tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the app's system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test

  windows:
    name: Windows build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test the search core
        run: cargo test -p qd-core
      - name: Build the app and its installer
        working-directory: crates/qd-app
        run: npx --yes @tauri-apps/cli@2 build
      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: quick-dictionary-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/quick-dictionary.exe
          if-no-files-found: error
